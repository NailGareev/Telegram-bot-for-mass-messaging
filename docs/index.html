<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Сканер билетов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg-top: #4a2a22;
    --bg-bottom: #2b1612;
    --cream: #fdf3b8;
    --gold: #e9c46a;
    --gold-soft: rgba(233, 196, 106, .28);
    --text: #fbf1dc;
    --muted: rgba(251, 241, 220, .62);
    --card: rgba(255, 244, 214, .07);
    --line: rgba(255, 244, 214, .16);
    --ok: #8fd6a0;
    --warn: #ffb37a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px calc(24px + env(safe-area-inset-bottom));
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(233, 196, 106, .16), transparent 60%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

  .eyebrow {
    margin: 0;
    font-size: 11px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    margin: 6px 0 0;
    font: 500 30px/1.15 Georgia, "Times New Roman", serif;
    letter-spacing: .01em;
    color: var(--cream);
    text-align: center;
  }

  /* Видоискатель */
  .finder {
    position: relative;
    width: min(64vw, 248px);
    aspect-ratio: 1;
    margin: 30px 0 22px;
    padding: 0;
    border: 0;
    border-radius: 28px;
    background: var(--card);
    box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .35);
    cursor: pointer;
    overflow: hidden;
    transition: transform .15s ease;
  }
  .finder:active { transform: scale(.975); }
  .finder svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .finder .qr { opacity: .2; }
  .finder .beam {
    position: absolute;
    left: 14%; right: 14%; top: 16%;
    height: 2px;
    border-radius: 2px;
    background: var(--gold);
    box-shadow: 0 0 18px 4px var(--gold-soft);
    animation: sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 100% { transform: translateY(0); opacity: .35; }
    50% { transform: translateY(min(43vw, 166px)); opacity: 1; }
  }
  body[data-state="idle"] .beam,
  body[data-state="blocked"] .beam { animation: none; opacity: 0; }

  .status {
    min-height: 46px;
    margin: 0 0 18px;
    max-width: 320px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }
  .status b { display: block; color: var(--text); font-weight: 600; font-size: 17px; }
  body[data-state="blocked"] .status b { color: var(--warn); }

  .btn {
    width: 100%;
    padding: 16px 18px;
    border: 0;
    border-radius: 16px;
    font: 600 17px/1 inherit;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn-primary {
    color: #3a1f17;
    background: linear-gradient(180deg, #fff3b0, var(--gold));
    box-shadow: 0 10px 26px rgba(233, 196, 106, .28);
  }
  .btn-ghost {
    width: auto;
    flex: none;
    padding: 0 20px;
    color: var(--cream);
    background: rgba(255, 244, 214, .12);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  body[data-state="blocked"] #scan { display: none; }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin: 26px 0 16px;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .manual { display: flex; gap: 10px; width: 100%; }
  .manual input {
    flex: 1;
    min-width: 0;
    height: 54px;
    padding: 0 16px;
    border: 0;
    border-radius: 16px;
    font: 500 17px/1 inherit;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    box-shadow: inset 0 0 0 1px var(--line);
    outline: none;
    transition: box-shadow .15s ease;
  }
  .manual input::placeholder { color: var(--muted); font-weight: 400; }
  .manual input:focus { box-shadow: inset 0 0 0 1.5px var(--gold); }
  .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .finder .beam { animation: none; top: 50%; opacity: .8; }
    .btn, .finder { transition: none; }
  }
</style>
</head>
<body data-state="opening">
<main>
  <p class="eyebrow">Check-in</p>
  <h1>Сканер билетов</h1>

  <button class="finder" id="finder" type="button" aria-label="Сканировать QR-код">
    <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <!-- уголки видоискателя -->
      <g stroke="#e9c46a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 30V22a8 8 0 0 1 8-8h8"/>
        <path d="M70 14h8a8 8 0 0 1 8 8v8"/>
        <path d="M86 70v8a8 8 0 0 1-8 8h-8"/>
        <path d="M30 86h-8a8 8 0 0 1-8-8v-8"/>
      </g>
      <!-- условный QR -->
      <g class="qr" fill="#fdf3b8">
        <path d="M30 30h14v14H30zM34 34v6h6v-6zM56 30h14v14H56zM60 34v6h6v-6zM30 56h14v14H30zM34 60v6h6v-6z" fill-rule="evenodd"/>
        <path d="M48 30h4v4h-4zM48 38h4v8h-4zM30 48h6v4h-6zM40 48h4v4h-4zM48 50h6v4h-6zM58 48h4v4h-4zM66 48h4v6h-4zM56 56h6v6h-6zM66 58h4v4h-4zM48 58h4v6h-4zM56 66h4v4h-4zM62 64h8v6h-8zM48 66h4v4h-4z"/>
      </g>
    </svg>
    <span class="beam"></span>
  </button>

  <p class="status" id="status" role="status"><b>Открываю камеру…</b></p>

  <button class="btn btn-primary" id="scan" type="button">Сканировать QR-код</button>

  <div class="divider">или по номеру</div>

  <form class="manual" id="manual">
    <input id="number" inputmode="numeric" autocomplete="off" placeholder="Номер билета" aria-label="Номер билета">
    <button class="btn btn-ghost" type="submit">Проверить</button>
  </form>
  <p class="hint">Если QR не читается — введите номер с билета, например 12</p>
</main>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  // Внутри Telegram platform — это "ios", "android", "tdesktop" и т. п.
  // (initData проверять нельзя: при запуске с кнопки клавиатуры он пустой.)
  var inTelegram = !!tg && !!tg.platform && tg.platform !== "unknown";
  var canScan = inTelegram && typeof tg.showScanQrPopup === "function" && tg.isVersionAtLeast("6.4");
  var statusEl = document.getElementById("status");
  var sent = false;

  function setState(state, title, text) {
    document.body.dataset.state = state;
    statusEl.innerHTML = "";
    var b = document.createElement("b");
    b.textContent = title;
    statusEl.appendChild(b);
    if (text) statusEl.appendChild(document.createTextNode(text));
  }

  function send(text) {
    if (sent) return;
    sent = true;
    try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    // Бот получит текст, отметит билет и пришлёт данные клиента в чат
    tg.sendData(text);
  }

  function scan() {
    if (!canScan) return;
    setState("opening", "Наведите камеру на QR-код", "Билет проверится автоматически");
    try {
      tg.showScanQrPopup({ text: "Наведите камеру на QR-код билета" }, function (text) {
        if (!text) return false;
        send(text);
        return true; // закрыть сканер
      });
    } catch (e) {
      setState("idle", "Камера не открылась", "Разрешите Telegram доступ к камере в настройках телефона и нажмите кнопку ниже");
    }
  }

  if (inTelegram) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("#4a2a22"); tg.setBackgroundColor("#2b1612"); } catch (e) {}
    tg.onEvent("scanQrPopupClosed", function () {
      if (!sent) setState("idle", "Сканер закрыт", "Нажмите кнопку, чтобы открыть камеру снова");
    });
  }

  if (canScan) {
    // Небольшая пауза: некоторым версиям Telegram нужно время после открытия страницы
    setTimeout(scan, 250);
  } else if (inTelegram) {
    setState("blocked", "Камера доступна только на телефоне", "В этой версии Telegram можно проверить билет по номеру");
  } else {
    setState("blocked", "Откройте сканер из бота", "Страница работает только внутри Telegram — нажмите «Сканировать» в боте");
  }

  document.getElementById("scan").addEventListener("click", scan);
  document.getElementById("finder").addEventListener("click", scan);
  document.getElementById("manual").addEventListener("submit", function (event) {
    event.preventDefault();
    var digits = document.getElementById("number").value.replace(/\D/g, "");
    if (digits && inTelegram) send("#" + digits);
  });
})();
</script>
</body>
</html>
